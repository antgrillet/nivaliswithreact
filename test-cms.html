<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CMS Nivalis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test CMS Nivalis</h1>
    
    <div class="section">
        <h2>Test API Marques</h2>
        <button onclick="testMarques()">Tester GET /api/cms/marques</button>
        <div id="marques-result"></div>
    </div>
    
    <div class="section">
        <h2>Test API Contenu</h2>
        <button onclick="testContent()">Tester GET /api/cms/content</button>
        <button onclick="testContentSection()">Tester GET /api/cms/content?section=homepage</button>
        <div id="content-result"></div>
    </div>
    
    <div class="section">
        <h2>Test Modification Contenu</h2>
        <button onclick="testUpdateContent()">Tester PUT /api/cms/content</button>
        <div id="update-result"></div>
    </div>

    <script>
        async function testMarques() {
            const result = document.getElementById('marques-result');
            try {
                const response = await fetch('/api/cms/marques');
                const data = await response.json();
                result.innerHTML = `
                    <div class="success">
                        <h3>✅ API Marques fonctionne</h3>
                        <p>Nombre de marques: ${data.marques?.length || 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ Erreur API Marques</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testContent() {
            const result = document.getElementById('content-result');
            try {
                const response = await fetch('/api/cms/content');
                const data = await response.json();
                result.innerHTML = `
                    <div class="success">
                        <h3>✅ API Contenu fonctionne</h3>
                        <p>Sections disponibles: ${Object.keys(data).join(', ')}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ Erreur API Contenu</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testContentSection() {
            const result = document.getElementById('content-result');
            try {
                const response = await fetch('/api/cms/content?section=homepage&subsection=hero');
                const data = await response.json();
                result.innerHTML = `
                    <div class="success">
                        <h3>✅ API Contenu Section fonctionne</h3>
                        <p>Section homepage/hero:</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ Erreur API Contenu Section</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testUpdateContent() {
            const result = document.getElementById('update-result');
            try {
                const testData = {
                    section: 'homepage',
                    subsection: 'hero',
                    content: {
                        subtitle: 'Multi-marques - TEST',
                        description: 'Test de modification du contenu via API'
                    }
                };

                const response = await fetch('/api/cms/content', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ Modification réussie</h3>
                            <p>Le contenu a été mis à jour</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Erreur inconnue');
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ Erreur Modification</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
